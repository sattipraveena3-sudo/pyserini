name: onboarding-learned-sparse

on:
  push:
    branches: [onboarding-reproduction]
  pull_request:
    branches: [master]

jobs:
  nfcorpus-splade-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyserini huggingface_hub

      - name: Verify packaged Pyserini import
        run: |
          mkdir -p /tmp/pyserini-splade
          cd /tmp/pyserini-splade
          python - <<'PY'
          import pyserini
          print(pyserini.__file__)
          assert 'site-packages' in pyserini.__file__, pyserini.__file__
          PY

      - name: Check SPLADE-v3 access
        id: access
        run: |
          mkdir -p /tmp/pyserini-splade/evidence
          if [ -z "$HF_TOKEN" ]; then
            echo "SPLADE-v3 reproduction blocked: repository secret HF_TOKEN is not configured." | tee /tmp/pyserini-splade/evidence/splade-status.txt
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd /tmp/pyserini-splade
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).model_info('naver/splade-v3')
          print('Authenticated access to naver/splade-v3 confirmed.')
          PY
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Prepare NFCorpus
        if: steps.access.outputs.available == 'true'
        run: |
          cd /tmp/pyserini-splade
          mkdir -p collections encode/nfcorpus.splade-v3 indexes runs evidence
          wget -q https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/nfcorpus.zip -P collections
          unzip -q collections/nfcorpus.zip -d collections
          python - <<'PY'
          import json
          with open('collections/nfcorpus/queries.tsv','w') as out:
              for line in open('collections/nfcorpus/queries.jsonl'):
                  x=json.loads(line); out.write(x['_id']+'\t'+x['text']+'\n')
          PY
          tail -n +2 collections/nfcorpus/qrels/test.tsv | sed 's/\t/\tQ0\t/' > collections/nfcorpus/qrels/test.qrels

      - name: Encode NFCorpus with SPLADE-v3
        if: steps.access.outputs.available == 'true'
        run: |
          cd /tmp/pyserini-splade
          python -m pyserini.encode \
            input --corpus collections/nfcorpus/corpus.jsonl \
                  --fields title text \
            output --embeddings encode/nfcorpus.splade-v3 \
            encoder --encoder naver/splade-v3 \
                    --encoder-class splade \
                    --fields title text \
                    --max-length 512 \
                    --device cpu \
                    --batch 8

      - name: Build SPLADE-v3 Lucene impact index
        if: steps.access.outputs.available == 'true'
        run: |
          cd /tmp/pyserini-splade
          python -m pyserini.index.lucene \
            --collection JsonVectorCollection \
            --input encode/nfcorpus.splade-v3 \
            --index indexes/nfcorpus.splade-v3 \
            --generator DefaultLuceneDocumentGenerator \
            --threads 4 \
            --impact \
            --pretokenized

      - name: Retrieve and evaluate SPLADE-v3
        if: steps.access.outputs.available == 'true'
        run: |
          cd /tmp/pyserini-splade
          python -m pyserini.search.lucene \
            --index indexes/nfcorpus.splade-v3 \
            --topics collections/nfcorpus/queries.tsv \
            --output runs/run.splade.txt \
            --hits 1000 \
            --encoder naver/splade-v3 \
            --remove-query \
            --output-format trec \
            --impact \
            --threads 4
          python -m pyserini.eval.trec_eval \
            -c -m ndcg_cut.10 collections/nfcorpus/qrels/test.qrels \
            runs/run.splade.txt | tee evidence/splade-eval.txt
          python - <<'PY'
          import re
          text=open('evidence/splade-eval.txt').read()
          m=re.search(r'ndcg_cut_10\s+all\s+([0-9.]+)', text)
          assert m, text
          score=float(m.group(1))
          print('nDCG@10=', score)
          assert abs(score-0.3624) <= 0.005, score
          PY

      - name: Interactive SPLADE-v3 check
        if: steps.access.outputs.available == 'true'
        run: |
          cd /tmp/pyserini-splade
          python - <<'PY' | tee evidence/splade-interactive.txt
          import torch
          from pyserini.search.lucene import LuceneImpactSearcher
          from pyserini.encode import SpladeQueryEncoder
          encoder = SpladeQueryEncoder(model_name_or_path='naver/splade-v3', device='cuda' if torch.cuda.is_available() else 'cpu')
          searcher = LuceneImpactSearcher('indexes/nfcorpus.splade-v3', query_encoder=encoder)
          hits = searcher.search('How to Help Prevent Abdominal Aortic Aneurysms', k=10)
          for i,h in enumerate(hits,1): print(i,h.docid,f'{h.score:.6f}')
          assert hits[0].docid == 'MED-4555'
          PY

      - name: Record successful reproduction
        if: steps.access.outputs.available == 'true'
        run: |
          echo "SPLADE-v3 NFCorpus reproduction completed successfully." | tee /tmp/pyserini-splade/evidence/splade-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfcorpus-splade-v3-evidence
          path: /tmp/pyserini-splade/evidence/
          if-no-files-found: warn
