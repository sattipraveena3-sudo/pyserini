name: finalize-onboarding-contribution

on:
  push:
    branches: [onboarding-reproduction]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: onboarding-reproduction
          fetch-depth: 0
      - name: Add verified reproduction-log entries
        run: |
          set -euo pipefail
          entry='+ Results reproduced by [@sattipraveena3-sudo](https://github.com/sattipraveena3-sudo) on 2026-08-21 (commit [`e863f8e`](https://github.com/castorini/pyserini/commit/e863f8e301990cab979f327f5b292ddfcc94a1f7))'
          for f in \
            docs/experiments-msmarco-passage.md \
            docs/conceptual-framework.md \
            docs/experiments-nfcorpus.md \
            docs/conceptual-framework2.md
          do
            if ! grep -Fq '@sattipraveena3-sudo' "$f"; then
              printf '\n%s\n' "$entry" >> "$f"
            fi
          done
      - name: Remove temporary validation workflows
        run: |
          git rm -f \
            .github/workflows/onboarding-reproduction.yml \
            .github/workflows/onboarding-conceptual-nfcorpus.yml \
            .github/workflows/onboarding-deeper-dive.yml \
            .github/workflows/onboarding-learned-sparse.yml \
            .github/workflows/finalize-onboarding-contribution.yml
      - name: Commit clean contribution branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiments-msmarco-passage.md docs/conceptual-framework.md docs/experiments-nfcorpus.md docs/conceptual-framework2.md
          git diff --cached --check
          git commit -m 'Add Pyserini onboarding reproduction logs'
          git push origin HEAD:onboarding-reproduction
