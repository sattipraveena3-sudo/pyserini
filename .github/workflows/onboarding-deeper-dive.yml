name: onboarding-deeper-dive

on:
  push:
    branches: [onboarding-reproduction]
  pull_request:
    branches: [master]

jobs:
  deeper-dense-sparse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: Install runtime
        working-directory: /tmp
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyserini faiss-cpu numpy
          python - <<'PY'
          import pyserini
          print('PYSERINI_PATH', pyserini.__file__)
          assert '/site-packages/' in pyserini.__file__, pyserini.__file__
          PY

      - name: Prepare NFCorpus
        working-directory: /tmp
        run: |
          rm -rf pyserini-deeper
          mkdir -p pyserini-deeper/collections pyserini-deeper/indexes pyserini-deeper/runs
          cd pyserini-deeper
          wget -q https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/nfcorpus.zip -P collections
          unzip -q collections/nfcorpus.zip -d collections
          python - <<'PY'
          import json, os
          os.makedirs('collections/nfcorpus/pyserini-corpus', exist_ok=True)
          with open('collections/nfcorpus/queries.tsv','w') as out:
              for line in open('collections/nfcorpus/queries.jsonl'):
                  x=json.loads(line); out.write(x['_id']+'\t'+x['text']+'\n')
          with open('collections/nfcorpus/pyserini-corpus/corpus.jsonl','w') as out:
              for line in open('collections/nfcorpus/corpus.jsonl'):
                  x=json.loads(line)
                  out.write(json.dumps({'id':x['_id'],'contents':x['title']+' '+x['text']})+'\n')
          PY

      - name: Encode BGE dense vectors and build Faiss index
        working-directory: /tmp/pyserini-deeper
        run: |
          python -m pyserini.encode \
            input --corpus collections/nfcorpus/corpus.jsonl --fields title text \
            output --embeddings indexes/nfcorpus.bge-base-en-v1.5 --to-faiss \
            encoder --encoder BAAI/bge-base-en-v1.5 --l2-norm --device cpu \
                    --pooling mean --fields title text --batch 16

      - name: Verify dense vectors and manual score
        working-directory: /tmp/pyserini-deeper
        run: |
          python - <<'PY' | tee dense-deeper.txt
          import faiss, numpy as np
          from pyserini.encode import AutoQueryEncoder
          index = faiss.read_index('indexes/nfcorpus.bge-base-en-v1.5/index')
          docids = [x.rstrip() for x in open('indexes/nfcorpus.bge-base-en-v1.5/docid')]
          assert index.ntotal == 3633, index.ntotal
          v = index.reconstruct(docids.index('MED-4555'))
          q = AutoQueryEncoder('BAAI/bge-base-en-v1.5', device='cpu', pooling='mean', l2_norm=True).encode('How to Help Prevent Abdominal Aortic Aneurysms')
          score = float(np.dot(q, v))
          print('num_vectors=', index.ntotal)
          print('MED-4555_manual_dot=', score)
          assert abs(score - 0.7913785) < 5e-3, score
          PY

      - name: Build sparse BM25 NFCorpus index
        working-directory: /tmp/pyserini-deeper
        run: |
          python - <<'PY'
          import pyserini
          print('INDEX_PYSERINI_PATH', pyserini.__file__)
          assert '/site-packages/' in pyserini.__file__, pyserini.__file__
          PY
          python -m pyserini.index.lucene \
            --collection JsonCollection \
            --input collections/nfcorpus/pyserini-corpus \
            --index indexes/lucene.nfcorpus \
            --generator DefaultLuceneDocumentGenerator \
            --storePositions --storeDocvectors --storeRaw
          test -d indexes/lucene.nfcorpus

      - name: Verify sparse representation and manual BM25 score
        working-directory: /tmp/pyserini-deeper
        run: |
          python - <<'PY' | tee sparse-deeper.txt
          from pyserini.index.lucene import LuceneIndexReader
          from pyserini.analysis import Analyzer, get_lucene_analyzer
          from pyserini.search.lucene import LuceneSearcher
          reader = LuceneIndexReader('indexes/lucene.nfcorpus')
          tf = reader.get_document_vector('MED-4555')
          weights = {t: reader.compute_bm25_term_weight('MED-4555', t, analyzer=None) for t in tf.keys()}
          analyzer = Analyzer(get_lucene_analyzer())
          qtokens = analyzer.analyze('How to Help Prevent Abdominal Aortic Aneurysms')
          manual = sum(weights.get(t, 0.0) for t in qtokens)
          searcher = LuceneSearcher('indexes/lucene.nfcorpus')
          hit = searcher.search('How to Help Prevent Abdominal Aortic Aneurysms', k=1)[0]
          print('query_tokens=', qtokens)
          print('manual_bm25=', manual)
          print('top_doc=', hit.docid)
          print('lucene_score=', hit.score)
          assert abs(manual - hit.score) < 1e-3, (manual, hit.score)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deeper-dense-sparse-evidence
          path: |
            /tmp/pyserini-deeper/dense-deeper.txt
            /tmp/pyserini-deeper/sparse-deeper.txt
          if-no-files-found: ignore
