name: onboarding-reproduction

on:
  push:
    branches: [onboarding-reproduction]
  pull_request:
    branches: [master]

jobs:
  msmarco-bm25:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Pyserini runtime
        working-directory: /tmp
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyserini
          python - <<'PY'
          import pyserini, sys
          print('PYTHON', sys.version)
          print('PYSERINI_PATH', pyserini.__file__)
          PY
          java -version

      - name: Fetch current Castorini evaluation data
        working-directory: /tmp
        run: |
          mkdir -p pyserini-onboarding/runs pyserini-onboarding/eval
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/castorini/eval/master/topics/topics.msmarco-passage.dev-subset.txt \
            -o pyserini-onboarding/eval/msmarco-passage-dev-subset.txt
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/castorini/eval/master/qrels/qrels.msmarco-passage.dev-subset.txt \
            -o pyserini-onboarding/eval/qrels.msmarco-passage.dev-subset.txt
          test -s pyserini-onboarding/eval/msmarco-passage-dev-subset.txt
          test -s pyserini-onboarding/eval/qrels.msmarco-passage.dev-subset.txt
          test "$(wc -l < pyserini-onboarding/eval/msmarco-passage-dev-subset.txt)" -eq 6980
          echo "topics=$(wc -l < pyserini-onboarding/eval/msmarco-passage-dev-subset.txt)"
          echo "qrels=$(wc -l < pyserini-onboarding/eval/qrels.msmarco-passage.dev-subset.txt)"

      - name: Reproduce MS MARCO BM25 baseline with Python API
        working-directory: /tmp/pyserini-onboarding
        run: |
          python - <<'PY'
          from pyserini.search.lucene import LuceneSearcher

          qids, queries = [], []
          with open('eval/msmarco-passage-dev-subset.txt', encoding='utf-8') as f:
              for line in f:
                  qid, query = line.rstrip('\n').split('\t', 1)
                  qids.append(qid)
                  queries.append(query)

          assert len(qids) == 6980, len(qids)
          searcher = LuceneSearcher.from_prebuilt_index('msmarco-v1-passage')
          searcher.set_bm25(0.82, 0.68)
          results = searcher.batch_search(queries, qids, k=1000, threads=8)
          assert len(results) == 6980, len(results)

          with open('runs/run.msmarco-passage.bm25.txt', 'w', encoding='utf-8') as msmarco, \
               open('runs/run.msmarco-passage.bm25.trec', 'w', encoding='utf-8') as trec:
              for qid in qids:
                  hits = results.get(qid, [])
                  for rank, hit in enumerate(hits, start=1):
                      msmarco.write(f'{qid}\t{hit.docid}\t{rank}\n')
                      trec.write(f'{qid} Q0 {hit.docid} {rank} {hit.score:.8f} pyserini-bm25\n')

          print('QueriesRanked:', len(results))
          PY
          test -s runs/run.msmarco-passage.bm25.txt
          test -s runs/run.msmarco-passage.bm25.trec

      - name: Evaluate MRR@10 from local qrels
        working-directory: /tmp/pyserini-onboarding
        run: |
          python - <<'PY' | tee /tmp/msmarco-mrr.txt
          from collections import defaultdict

          relevant = defaultdict(set)
          with open('eval/qrels.msmarco-passage.dev-subset.txt') as f:
              for line in f:
                  qid, _, docid, rel = line.split()
                  if int(rel) > 0:
                      relevant[qid].add(docid)

          ranked = defaultdict(list)
          with open('runs/run.msmarco-passage.bm25.txt') as f:
              for line in f:
                  qid, docid, rank = line.split()
                  if int(rank) <= 10:
                      ranked[qid].append(docid)

          rr = 0.0
          for qid in relevant:
              for rank, docid in enumerate(ranked.get(qid, []), start=1):
                  if docid in relevant[qid]:
                      rr += 1.0 / rank
                      break
          mrr = rr / len(relevant)
          print(f'MRR @10: {mrr:.16f}')
          print(f'QueriesRanked: {len(ranked)}')
          assert len(ranked) == 6980, len(ranked)
          assert abs(mrr - 0.18741227770955546) < 1e-6, mrr
          PY

      - name: Reproduce TREC metrics
        working-directory: /tmp/pyserini-onboarding
        run: |
          python -m pyserini.eval.trec_eval -c -mrecall.1000 -mmap \
            eval/qrels.msmarco-passage.dev-subset.txt \
            runs/run.msmarco-passage.bm25.trec | tee /tmp/msmarco-trec.txt
          grep -E 'map[[:space:]]+all[[:space:]]+0\.195[78]' /tmp/msmarco-trec.txt
          grep -E 'recall_1000[[:space:]]+all[[:space:]]+0\.8573' /tmp/msmarco-trec.txt

      - name: Verify interactive retrieval
        working-directory: /tmp
        run: |
          python - <<'PY' | tee /tmp/interactive.txt
          from pyserini.search.lucene import LuceneSearcher
          searcher = LuceneSearcher.from_prebuilt_index('msmarco-v1-passage')
          searcher.set_bm25(0.82, 0.68)
          hits = searcher.search("what is paula deen's brother", k=10)
          for i, h in enumerate(hits, start=1):
              print(i, h.docid, f'{h.score:.6f}')
          assert hits[0].docid == '7187158', hits[0].docid
          PY

      - name: Write evidence summary
        if: always()
        run: |
          {
            echo '# Pyserini onboarding reproduction: MS MARCO BM25'
            echo
            echo 'Environment: Ubuntu 24.04, Python 3.12, Java 21'
            echo 'Index: official prebuilt msmarco-v1-passage'
            echo 'Topics/qrels: current castorini/eval repository'
            echo 'Execution: LuceneSearcher.batch_search (bypasses CLI topic-order bug)'
            echo 'BM25: k1=0.82, b=0.68, hits=1000'
            echo
            cat /tmp/msmarco-mrr.txt 2>/dev/null || true
            cat /tmp/msmarco-trec.txt 2>/dev/null || true
            echo
            echo 'Interactive top-10:'
            cat /tmp/interactive.txt 2>/dev/null || true
          } | tee reproduction-summary.txt
          cat reproduction-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyserini-msmarco-bm25-reproduction
          path: |
            reproduction-summary.txt
            /tmp/msmarco-mrr.txt
            /tmp/msmarco-trec.txt
            /tmp/interactive.txt
          if-no-files-found: ignore
